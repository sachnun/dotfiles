# nvm target on Debian/Ubuntu (apt ships old node, while pi requires >= v20).
# "node" tracks the latest stable release; use "lts/*" for latest LTS, or pin a major (e.g. "22").
nodejs_lts: "node"

packages:
  pacman:
    - base
    - base-devel
    - age
    - btop
    - chezmoi
    - curl
    - expect
    - fd
    - fish
    - fzf
    - git
    - git-lfs
    - github-cli
    - gnupg
    - go
    - grep
    - jq
    - nano
    - nodejs
    - npm
    - openssh
    - opencode
    - python
    - ripgrep
    - rclone
    - sqlite
    - starship
    - sudo
    - tmux
    - tree
    - unzip
    - uv
    - vim
    - wget
    - zip
  pkg:
    - age
    - chezmoi
    - expect
    - fd
    - file
    - fish
    - fzf
    - gh
    - git
    - git-lfs
    - gnupg
    - golang
    - jq
    - man
    - nodejs
    - openssh
    - python
    - rclone
    - ripgrep
    - rsync
    - sqlite
    - starship
    - termux-api
    - termux-services
    - tmux
    - tree
    - uv
    - vim
    - wget
    - which
    - zip
  apt:
    - age
    - btop
    - build-essential
    - curl
    - expect
    - fd-find
    - fish
    - fzf
    - gh
    - git
    - git-lfs
    - gnupg
    - golang-go
    - jq
    - nano
    - openssh-client
    - python3
    - ripgrep
    - rclone
    - sqlite3
    - sudo
    - tmux
    - tree
    - unzip
    - vim
    - wget
    - zip
