tools:
  - name: chezmoi
    install: sh -c "$(curl -fsLS get.chezmoi.io/lb)"
  - name: uv
    install: curl -LsSf https://astral.sh/uv/install.sh | sh -s -- --no-modify-path
  - name: opencode
    install: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
    exclude_android: true
  - name: starship
    install: curl -sS https://starship.rs/install.sh | sh -s -- --yes --bin-dir "$INSTALL_DIR"
  - name: pi
    install: curl -fsSL https://pi.dev/install.sh | sh
