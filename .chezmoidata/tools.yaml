tools:
  - name: chezmoi
    install: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$INSTALL_DIR"
  - name: starship
    install: curl -sS https://starship.rs/install.sh | sh -s -- --yes --bin-dir "$INSTALL_DIR"
  - name: opencode2
    install: curl -fsSL https://raw.githubusercontent.com/anomalyco/opencode/v2/install | bash
  - name: pi
    install: curl -fsSL https://pi.dev/install.sh | sh
  - name: herdr
    install: curl -fsSL https://herdr.dev/install.sh | sh

