[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:fish" = "latest"
"apt:git" = "latest"
"apt:git-lfs" = "latest"
"apt:openssh-client" = "latest"
"apt:wget" = "latest"
"apt:aria2" = "latest"
"apt:expect" = "latest"
"pacman:nano" = "latest"
"pacman:tree" = "latest"
"apt:unzip" = "latest"
"apt:zip" = "latest"
"apt:btop" = "latest"
"apt:tmux" = "latest"
"apt:fastfetch" = "latest"
"apt:jq" = "latest"
"apt:bat" = "latest"
"apt:rclone" = "latest"
"apt:starship" = "latest"
"apt:ffmpeg" = "latest"
"pacman:base" = "latest"
"pacman:base-devel" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:git-lfs" = "latest"
"pacman:fish" = "latest"
"pacman:openssh" = "latest"
"pacman:btop" = "latest"
"pacman:tmux" = "latest"
"pacman:fastfetch" = "latest"
"pacman:jq" = "latest"
"pacman:bat" = "latest"
"pacman:rclone" = "latest"
"pacman:starship" = "latest"
"pacman:ffmpeg" = "latest"

[bootstrap.user]
login_shell = "/usr/bin/fish"

[tools]
cloudflared = "latest"
gh = "latest"
"github:ekzhang/bore" = "latest"
glab = "latest"
go = "latest"
mitmproxy = "latest"
node = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = true }
"pipx:google-colab-cli" = "latest"
python = "latest"
turso = "latest"
uv = "latest"
wrangler = { version = "latest", allow_builds = [
  "esbuild",
  "sharp",
  "workerd",
] }
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
"pipx:speedtest-cli" = "latest"
"npm:agent-browser" = "latest"
bun = "latest"
neonctl = "latest"
"github:koyeb/koyeb-cli" = "latest"
railway = "latest"
flyctl = "latest"
gcloud = "latest"
rust = "latest"
herdr = "latest"

[settings]
minimum_release_age = "0"
auto_update = true
experimental = true

[shell_alias]
cr = "chezmoi re-add"
cu = "chezmoi update"
