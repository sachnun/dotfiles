[bootstrap.packages]
"pacman:nano" = "latest"
"pacman:tree" = "latest"
"pacman:base" = "latest"
"pacman:base-devel" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:git-lfs" = "latest"
"pacman:fish" = "latest"
"pacman:openssh" = "latest"
"pacman:btop" = "latest"
"pacman:tmux" = "latest"
"pacman:fastfetch" = "latest"
"pacman:jq" = "latest"
"pacman:bat" = "latest"
"pacman:rclone" = "latest"
"pacman:starship" = "latest"
"pacman:ffmpeg" = "latest"
"pacman:cloudflared" = "latest"
"pacman:docker" = "latest"
"pacman:python" = "latest"
"pacman:go" = "latest"
"pacman:nodejs" = "latest"
"pacman:npm" = "latest"
"pacman:github-cli" = "latest"
"pacman:glab" = "latest"
"pacman:less" = "latest"

[bootstrap.user]
login_shell = "/usr/bin/fish"

[tools]
"npm:@earendil-works/pi-coding-agent" = "latest"
uv = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
"pipx:speedtest-cli" = "latest"
"github:koyeb/koyeb-cli" = "latest"
railway = "latest"
flyctl = "latest"
gcloud = "latest"
"npm:edgeone" = "latest"
rust = "stable"
bun = "latest"

[settings]
minimum_release_age = "0"
auto_update = true
experimental = true
trusted_config_paths = ["~"]

[settings.npm]
shell_out = true

[shell_alias]
cr = "chezmoi re-add"
cu = "chezmoi update"

