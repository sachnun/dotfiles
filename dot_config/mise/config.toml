[bootstrap.packages]
"pacman:nano" = "latest"
"pacman:tree" = "latest"
"pacman:base" = "latest"
"pacman:base-devel" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:git-lfs" = "latest"
"pacman:fish" = "latest"
"pacman:openssh" = "latest"
"pacman:btop" = "latest"
"pacman:tmux" = "latest"
"pacman:fastfetch" = "latest"
"pacman:jq" = "latest"
"pacman:bat" = "latest"
"pacman:rclone" = "latest"
"pacman:starship" = "latest"
"pacman:ffmpeg" = "latest"
"pacman:cloudflared" = "latest"
"pacman:python" = "latest"
"pacman:go" = "latest"
"pacman:nodejs" = "latest"
"pacman:npm" = "latest"
"pacman:github-cli" = "latest"
"pacman:glab" = "latest"

[bootstrap.user]
login_shell = "/usr/bin/fish"

[tools]
"github:ekzhang/bore" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = true }
"pipx:google-colab-cli" = "latest"
turso = "latest"
uv = "latest"
wrangler = { version = "latest", allow_builds = [
  "esbuild",
  "sharp",
  "workerd",
] }
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
"pipx:speedtest-cli" = "latest"
bun = "latest"
neonctl = "latest"
"github:koyeb/koyeb-cli" = "latest"
railway = "latest"
flyctl = "latest"
gcloud = "latest"
herdr = "latest"
"npm:agent-browser" = "latest"
"npm:edgeone" = "latest"

[settings]
minimum_release_age = "0"
auto_update = true
experimental = true

[settings.npm]
shell_out = true

[shell_alias]
cr = "chezmoi re-add"
cu = "chezmoi update"
