[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:fish" = "latest"
"apt:git" = "latest"
"apt:git-lfs" = "latest"
"apt:openssh-client" = "latest"
"apt:wget" = "latest"
"apt:aria2" = "latest"
"apt:expect" = "latest"
"pacman:nano" = "latest"
"pacman:tree" = "latest"
"apt:unzip" = "latest"
"apt:zip" = "latest"
"pacman:base" = "latest"
"pacman:base-devel" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:git-lfs" = "latest"
"pacman:fish" = "latest"
"pacman:openssh" = "latest"

[bootstrap.user]
login_shell = "/usr/bin/fish"

[tools]
btop = "latest"
tmux = "latest"
cloudflared = "latest"
fastfetch = "latest"
ffmpeg = "latest"
fzf = "latest"
gh = "latest"
"github:ekzhang/bore" = "latest"
glab = "latest"
glow = "latest"
go = "latest"
herdr = "latest"
jq = "latest"
mitmproxy = "latest"
node = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = true }
pipx = "latest"
"pipx:google-colab-cli" = "latest"
python = "latest"
rclone = "latest"
starship = "latest"
turso = "latest"
uv = "latest"
wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
"pipx:speedtest-cli" = "latest"
"npm:agent-browser" = "latest"
bun = "latest"
neonctl = "latest"
"github:koyeb/koyeb-cli" = "latest"
railway = "latest"
flyctl = "latest"
"npm:playwriter" = "latest"
gcloud = "latest"
rust = "latest"

[settings]
minimum_release_age = "0"
auto_update = true
experimental = true

[settings.age]

[shell_alias]
cr = "chezmoi re-add"
cu = "chezmoi update"

