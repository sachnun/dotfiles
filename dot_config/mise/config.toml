[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:git-lfs" = "latest"
"apt:openssh-client" = "latest"
"brew:wget" = "latest"
"brew:aria2" = "latest"
"brew:expect" = "latest"
"brew:fish" = "latest"
"brew:grep" = "latest"
"brew:libxml2" = "latest"
"brew:nano" = "latest"
"brew:tmux" = "latest"
"brew:tree" = "latest"
"brew:unzip" = "latest"
"brew:vim" = "latest"
"brew:zip" = "latest"
"pacman:base" = "latest"
"pacman:base-devel" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:git-lfs" = "latest"
"pacman:openssh" = "latest"
"pacman:sudo" = "latest"

[bootstrap.user]
login_shell = "/home/linuxbrew/.linuxbrew/bin/fish"

[tools]
btop = "latest"
bun = "latest"
cloudflared = "latest"
fastfetch = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
gh = "latest"
"github:ekzhang/bore" = "latest"
glab = "latest"
glow = "latest"
go = "latest"
herdr = "latest"
jq = "latest"
mitmproxy = "latest"
node = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = true }
pipx = "latest"
"pipx:google-colab-cli" = "latest"
python = "latest"
rclone = "latest"
ripgrep = "latest"
starship = "latest"
turso = "latest"
uv = "latest"
wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }

[settings]
minimum_release_age = "0"
auto_update = true
