[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:fish" = "latest"
"apt:git" = "latest"
"apt:git-lfs" = "latest"
"apt:openssh-client" = "latest"
"brew:wget" = "latest"
"brew:aria2" = "latest"
"brew:expect" = "latest"
"brew:nano" = "latest"
"brew:tree" = "latest"
"brew:unzip" = "latest"
"brew:zip" = "latest"
"pacman:base" = "latest"
"pacman:base-devel" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:git-lfs" = "latest"
"pacman:grep" = "latest"
"pacman:fish" = "latest"
"pacman:openssh" = "latest"
"pacman:sudo" = "latest"

[bootstrap.user]
login_shell = "/usr/bin/fish"

[tools]
btop = "latest"
tmux = "latest"
vim = "latest"
cloudflared = "latest"
fastfetch = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
gh = "latest"
"github:ekzhang/bore" = "latest"
glab = "latest"
glow = "latest"
go = "latest"
herdr = "latest"
jq = "latest"
mitmproxy = "latest"
node = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = true }
pipx = "latest"
"pipx:google-colab-cli" = "latest"
python = "latest"
rclone = "latest"
ripgrep = "latest"
starship = "latest"
turso = "latest"
uv = "latest"
wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
"pipx:speedtest-cli" = "latest"
"npm:agent-browser" = "latest"
bun = "latest"
"github:can1357/oh-my-pi" = "latest"
neonctl = "latest"

[settings]
minimum_release_age = "0"
auto_update = true
experimental = true

[settings.age]
key_file = "/root/.config/chezmoi/key.txt"

[shell_alias]
cr = "chezmoi re-add"
cu = "chezmoi update"

[env]
CLOUDFLARE_ACCOUNT_ID = "13e8f6d8fb7367570ada75fa71e1999d"
CLOUDFLARE_API_TOKEN = { age = "" }
NEON_API_KEY = { age = "" }
